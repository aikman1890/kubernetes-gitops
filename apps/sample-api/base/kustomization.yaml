# Base for the sample-api workload. The raw manifests in this directory are
# the single source of truth; environment differences live in overlays
# (see kustomize/overlays/*, re-exported via apps/sample-api/overlays/*).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml
  - pdb.yaml
  - networkpolicy.yaml
