# Base for the sample-api workload. References the app's own base in
# apps/sample-api/base so there is exactly one source of truth per
# resource; environment differences live in ../overlays/<env>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../apps/sample-api/base

labels:
  - pairs:
      app.kubernetes.io/managed-by: gitops
