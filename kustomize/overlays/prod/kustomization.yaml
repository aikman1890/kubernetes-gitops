# Prod overlay: full resilience — more replicas, bigger headroom, higher HPA floor.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../apps/sample-api/base

namespace: apps-prod

patches:
  # Prod runs 5 replicas across zones (see podAntiAffinity in the base).
  - target:
      kind: Deployment
      name: sample-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sample-api
      spec:
        replicas: 5
  # Prod HPA floor matches the replica count so autoscaling never scales
  # below the designed capacity.
  - target:
      kind: HorizontalPodAutoscaler
      name: sample-api
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: sample-api
      spec:
        minReplicas: 5
        maxReplicas: 20
  # Prod container resources: generous requests for QoS, higher limits.
  - target:
      kind: Deployment
      name: sample-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sample-api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: 200m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 1Gi
  # Prod PDB: never drop below 4 available during voluntary disruptions.
  - target:
      kind: PodDisruptionBudget
      name: sample-api
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: sample-api
      spec:
        minAvailable: 4
